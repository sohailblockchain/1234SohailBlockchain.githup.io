<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab Asset & Inventory Manager</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#1f2937}header{background:#111827;color:white;padding:22px}main{padding:24px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0001}.big{font-size:28px;font-weight:700}.toolbar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}input,select,button{padding:10px 12px;border:1px solid #d1d5db;border-radius:9px}button{cursor:pointer;background:#111827;color:#fff}table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}.ok{color:#15803d}.warn{color:#b45309}.bad{color:#b91c1c}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}table{font-size:12px}}
</style></head><body><header><h1>Lab Asset & Inventory Manager</h1><div>Computer Science Laboratory Operations Dashboard</div></header><main>
<div class="grid"><div class="card"><div>Total Assets</div><div class="big" id="total"></div></div><div class="card"><div>Operational</div><div class="big" id="operational"></div></div><div class="card"><div>Maintenance</div><div class="big" id="maintenance"></div></div><div class="card"><div>Warranty Expiring</div><div class="big" id="warranty"></div></div></div>
<div class="toolbar"><input id="q" placeholder="Search asset, room, user..." oninput="render()"><select id="status" onchange="render()"><option value="">All Status</option><option>Operational</option><option>Maintenance</option><option>Out of Service</option></select><button onclick="addAsset()">+ Add Sample Asset</button><button onclick="exportCSV()">Export CSV</button></div>
<table><thead><tr><th>Asset ID</th><th>Device</th><th>Room</th><th>IP</th><th>Status</th><th>Assigned</th><th>Last Service</th></tr></thead><tbody id="rows"></tbody></table>
<script>
let assets=[
{id:'CS-LAB-001',device:'Dell OptiPlex 7090',room:'Lab A',ip:'192.168.10.21',status:'Operational',assigned:'Seat A01',service:'2026-08-12'},
{id:'CS-LAB-002',device:'HP ProDesk 600',room:'Lab A',ip:'192.168.10.22',status:'Maintenance',assigned:'Seat A02',service:'2026-09-18'},
{id:'CS-LAB-017',device:'Cisco 24-Port Switch',room:'Network Rack',ip:'192.168.10.2',status:'Operational',assigned:'Rack R1',service:'2026-07-03'},
{id:'CS-LAB-024',device:'Epson Projector',room:'Lab B',ip:'-',status:'Operational',assigned:'Ceiling B',service:'2026-06-21'},
{id:'CS-LAB-031',device:'Lenovo ThinkCentre',room:'Lab B',ip:'192.168.20.31',status:'Out of Service',assigned:'Seat B07',service:'2026-09-01'}];
function stats(){total.textContent=assets.length;operational.textContent=assets.filter(a=>a.status==='Operational').length;maintenance.textContent=assets.filter(a=>a.status==='Maintenance').length;warranty.textContent=2}
function render(){let term=q.value.toLowerCase(),s=status.value;rows.innerHTML='';assets.filter(a=>(!s||a.status===s)&&Object.values(a).join(' ').toLowerCase().includes(term)).forEach(a=>{let c=a.status==='Operational'?'ok':a.status==='Maintenance'?'warn':'bad';rows.innerHTML+=`<tr><td>${a.id}</td><td>${a.device}</td><td>${a.room}</td><td>${a.ip}</td><td class="${c}">${a.status}</td><td>${a.assigned}</td><td>${a.service}</td></tr>`});stats()}
function addAsset(){assets.push({id:'CS-LAB-'+String(assets.length+40).padStart(3,'0'),device:'New Workstation',room:'Lab C',ip:'DHCP',status:'Operational',assigned:'Unassigned',service:new Date().toISOString().slice(0,10)});render()}
function exportCSV(){let csv='Asset ID,Device,Room,IP,Status,Assigned,Last Service\n'+assets.map(a=>Object.values(a).join(',')).join('\n');let b=new Blob([csv]);let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='lab-assets.csv';a.click()}
render()
</script></main></body></html>
